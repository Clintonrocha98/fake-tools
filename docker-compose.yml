services:
  sycorax-mailpit:
    build:
      dockerfile: docker/mailpit.Dockerfile
      context: .
    image: mailpit.local:1
    container_name: sycorax-mailpit
    restart: no
    hostname: dev
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - dev-sycorax
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 10s

networks:
  dev-sycorax:
    name: dev-sycorax
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: dev-sycorax
      com.docker.network.bridge.host_binding_ipv4: '127.0.0.1'
