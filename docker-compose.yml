services:
  fake-tools:
    build:
      dockerfile: Dockerfile
      context: .
    image: fake-tools.local:1
    container_name: fake-tools
    restart: no
    hostname: fake-tools
    environment:
      # Par que o monolito consumidor configura como BINANCE_API_KEY/SECRET
      # de dev — troque os defaults abaixo para casar com o outro lado.
      FAKE_BINANCE_API_KEY: ${FAKE_BINANCE_API_KEY:-fake-binance-local-key}
      FAKE_BINANCE_API_SECRET: ${FAKE_BINANCE_API_SECRET:-fake-binance-local-secret}
      # Velocidade do auto-advance de ordens fiat/withdraw; consumido pelo
      # ticket do painel, que ainda vai implementar o scheduler.
      FAKE_BINANCE_FIAT_ADVANCE_SECONDS: ${FAKE_BINANCE_FIAT_ADVANCE_SECONDS:-60}
      FAKE_BINANCE_WITHDRAW_ADVANCE_SECONDS: ${FAKE_BINANCE_WITHDRAW_ADVANCE_SECONDS:-60}
      # Ledger de partida. Formato: lista separada por vírgula de
      # ASSET:AMOUNT (ex.: BRL:100000,USDT:5000).
      FAKE_BINANCE_SEED_BALANCES: ${FAKE_BINANCE_SEED_BALANCES:-BRL:100000,USDT:5000}
      # Sobrescreva para casar com o hostname do ambiente onde o container roda.
      APP_URL: ${FAKE_TOOLS_APP_URL:-http://localhost:8080}
      # Banco: a instância do brd-digital, alcançada pelo nome do serviço dentro
      # da rede dev-brd — a porta aqui é a INTERNA (5432), nunca a publicada no
      # host. O database precisa existir antes do primeiro `up`; ver README.
      DB_CONNECTION: pgsql
      DB_HOST: ${FAKE_TOOLS_DB_HOST:-brd-db}
      DB_PORT: ${FAKE_TOOLS_DB_PORT:-5432}
      DB_DATABASE: ${FAKE_TOOLS_DB_DATABASE:-dev_fake_tools}
      DB_USERNAME: ${FAKE_TOOLS_DB_USERNAME:-postgres}
      DB_PASSWORD: ${FAKE_TOOLS_DB_PASSWORD:-postgres}
    ports:
      - '8080:8080'
    volumes:
      - fake-tools-data:/app/storage
    networks:
      - dev-brd
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8080/up']
      interval: 10s
      retries: 5
      timeout: 10s
      start_period: 15s

volumes:
  fake-tools-data:
    name: fake-tools-data

networks:
  # Rede do compose do brd-digital, onde vive o `brd-db` que este projeto reusa.
  # `external: true` porque quem a cria é o outro compose — um `up` aqui falha
  # se a stack do brd-digital nunca subiu. Acoplamento deliberado: não subimos
  # container de banco próprio.
  dev-brd:
    name: dev-brd
    external: true
